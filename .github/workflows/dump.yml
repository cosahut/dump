name: Dump and Restore Supabase

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump from old project (Singapore)
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          pg_dump --clean --if-exists \
            --quote-all-identifiers \
            --no-owner --no-privileges \
            --schema=kubi --schema=sahut \
            -h aws-1-ap-southeast-1.pooler.supabase.com \
            -p 5432 \
            -U postgres.edxwafkjordqqfqpptwv \
            -d postgres \
            -f dump.sql

      - name: Restore to new project (Frankfurt)
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql \
            -h aws-0-eu-central-1.pooler.supabase.com \
            -p 5432 \
            -U postgres.wmmmimtknjosauiaofvf \
            -d postgres \
            -f dump.sql

      - name: Reset sequences
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql \
            -h aws-0-eu-central-1.pooler.supabase.com \
            -p 5432 \
            -U postgres.wmmmimtknjosauiaofvf \
            -d postgres \
            -c "SELECT setval('sahut.knowledge_base_id_seq', 62);"
          psql \
            -h aws-0-eu-central-1.pooler.supabase.com \
            -p 5432 \
            -U postgres.wmmmimtknjosauiaofvf \
            -d postgres \
            -c "SELECT setval('sahut.memory_longterm_id_seq', 3);"

      - name: Upload dump as backup
        uses: actions/upload-artifact@v4
        with:
          name: supabase-dump
          path: dump.sql
