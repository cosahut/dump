name: Restore Supabase

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Download dump artifact
        uses: actions/download-artifact@v4
        with:
          name: supabase-dump

      - name: Restore database
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql \
            -h aws-0-eu-central-1.pooler.supabase.com \
            -p 5432 \
            -U postgres.wmmmimtknjosauiaofvf \
            -d postgres \
            -f dump.sql

      - name: Reset sequences
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql \
            -h aws-0-eu-central-1.pooler.supabase.com \
            -p 5432 \
            -U postgres.wmmmimtknjosauiaofvf \
            -d postgres \
            -c "SELECT setval('sahut.knowledge_base_id_seq', 62);"
            -c "SELECT setval('sahut.memory_longterm_id_seq', 3);"
