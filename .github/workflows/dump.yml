name: Dump Supabase

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump
        run: sudo apt-get install -y postgresql-client

      - name: Get IPv4
        run: |
          IP=$(dig +short A db.edxwafkjordqqfqpptwv.supabase.co | tail -1)
          echo "DB_IP=$IP" >> $GITHUB_ENV

      - name: Check IP
        run: echo ${{ env.DB_IP }}

      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          pg_dump --clean --if-exists \
            --quote-all-identifiers \
            --no-owner --no-privileges \
            --schema=kubi --schema=sahut \
            -h db.edxwafkjordqqfqpptwv.supabase.co \
            -p 5432 -U postgres -d postgres \
            -f dump.sql

      - name: Upload dump
        uses: actions/upload-artifact@v4
        with:
          name: supabase-dump
          path: dump.sql
