name: Dump Supabase

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get install -y postgresql-client dnsutils

      - name: Force IPv4 for Supabase
        run: |
          IP=$(dig +short A db.edxwafkjordqqfqpptwv.supabase.co @8.8.8.8 | grep -E '^[0-9]+\.' | head -1)
          echo "Resolved IP: $IP"
          echo "$IP db.edxwafkjordqqfqpptwv.supabase.co" | sudo tee -a /etc/hosts

      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          pg_dump --clean --if-exists \
            --quote-all-identifiers \
            --no-owner --no-privileges \
            --schema=kubi --schema=sahut \
            -h db.edxwafkjordqqfqpptwv.supabase.co \
            -p 5432 -U postgres -d postgres \
            -f dump.sql

      - name: Upload dump
        uses: actions/upload-artifact@v4
        with:
          name: supabase-dump
          path: dump.sql
